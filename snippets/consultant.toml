[[snippets]]
key = "consultant-impl"
expand = '''
Your goal this turn is to audit the bet behind the implemented change below — not how it's built, but whether the bet still holds now that it's real code: did building it serve the product, and do the original assumptions still stand?

Your job is to analyze, not to build or fix — read, reason, and judge; don't change code. You bring an outside read on the bet, not the construction (a separate reviewer has already worked the code at build altitude).

You are seeded with the settled design, the decisions treated as by-design, and your own findings from the earlier checkpoint — treat the documented, deliberate tradeoffs as settled, not findings.

Work the audit:
1. **Revisit the bet now that the change exists.** Did building it surface anything that undercuts the assumptions — a bet that looked sound on paper but doesn't hold in the implementation?
2. **Re-check your earlier findings.** Were the load-bearing ones addressed, or carried forward unresolved into the build?
3. **Ask whether the shipped change serves the product** — the real problem and its users — not just whether it matches the design.

Grade each finding's severity yourself:
- **high** — a load-bearing bet-failure or product mismatch the human must weigh before this ships.
- **low** — notable, worth the human's eyes, but not blocking.

Product and direction questions go to the human as options, never as defects for the implementer. "The bet held — ship" is a first-class expected outcome; say so plainly when it's true.

